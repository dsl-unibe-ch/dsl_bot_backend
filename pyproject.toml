[project]
name = "dsl_bot"
version = "0.1.6"
description = "Backend for DSL Bot-as-a-Service project"
readme = "README.md"
requires-python = "==3.14.7"

dependencies = [
    "langchain==1.3.18",
    "azure-search-documents==12.0.0",
    "azure-identity==1.25.3",
    "openai==3.7.0",
    "langchain_core==1.6.1",
    "python-dotenv==1.2.3",
    "langchain_openai==1.6.0",
    "ftfy==6.3.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic_settings==2.15.0",
    "pandas==3.0.5",
    "kafka-python==3.0.11",
    "azure-storage-blob==12.30.1",
    "langchain-classic==1.0.8",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "openevals==0.2.0",
    "scrapy==2.18.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "pytest-playwright==0.9.0",
    "playwright==1.62.0",
    "openpyxl==3.1.5",
    "locust==2.46.4",
    "pdfplumber==0.11.10",
    "langfuse==4.15.1"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", 
]

pydocstyle.convention = "google"

[tool.pytest.ini_options]
markers = [
    "langfuse: tests that integrate with Langfuse tracing",
    "regression: chatbot regression cases (Langfuse classifier + response checks)",
]
