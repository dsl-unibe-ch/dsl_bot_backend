[project]
name = "kioskbot"
version = "0.2.5"
description = "Kioskbot project"
readme = "README.md"
requires-python = "==3.12.11"

dependencies = [
    "langchain==1.2.15",
    "azure-search-documents==11.6.0",
    "azure-identity==1.24.0",
    "openai==2.31.0",
    "langchain_core==1.3.3",
    "dotenv==0.9.9",
    "langchain_openai==1.1.14",
    "ftfy==6.3.1",
    "fastapi==0.116.1",
    "azure-data-tables==12.7.0",
    "uvicorn==0.35.0",
    "pydantic_settings==2.10.1",
    "pandas==2.3.2",
    "kafka-python==2.2.15",
    "azure-storage-blob==12.26.0",
    "langchain-classic==1.0.7",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.12.11",
    "pre-commit==4.3.0",
    "pytest==9.0.3",
    "openevals==0.1.0",
    "scrapy==2.16.0",
    "beautifulsoup4==4.13.5",
    "lxml==6.1.0",
    "pytest-playwright==0.8.0",
    "playwright==1.55.0",
    "openpyxl==3.1.5",
    "langchain-experimental==0.4.1",
    "locust==2.43.0",
    "pdfplumber==0.11.9",
    "langfuse==4.5.1"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", 
]

pydocstyle.convention = "google"

[tool.pytest.ini_options]
markers = [
    "langfuse: tests that integrate with Langfuse tracing",
    "regression: chatbot regression cases (Langfuse classifier + response checks)",
]
