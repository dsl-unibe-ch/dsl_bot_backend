apiVersion: v1
kind: Service
metadata:
  name: redis  # plain name so REDIS_HOST=redis works identically in Docker Compose and on AKS
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: {{ .Values.labels.appName }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Values.managedBy }}
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.redis.service.type }} # ClusterIP — Redis is never exposed outside the cluster
  ports:
  - name: redis
    port: {{ .Values.redis.service.port }}
    targetPort: 6379
    protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.labels.appName }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
    app.kubernetes.io/component: redis
