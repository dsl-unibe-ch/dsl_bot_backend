apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}-redis
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: {{ .Values.labels.appName }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Values.managedBy }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1 # Single replica — Redis is session-local state; no data replication needed for dev
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.labels.appName }}
      app.kubernetes.io/instance: {{ .Values.labels.instance }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.labels.appName }}
        app.kubernetes.io/instance: {{ .Values.labels.instance }}
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        # Start Redis with LRU eviction so it never OOMs (evicts least-recently-used keys)
        # If REDIS_PASSWORD is set in the secret, enforce authentication via --requirepass
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.fullnameOverride }}-secrets
              key: REDIS_PASSWORD
              optional: true
        command:
        - /bin/sh
        - -c
        - |
          if [ -n "$REDIS_PASSWORD" ]; then
            exec redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
          else
            exec redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
          fi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-cli -a "$REDIS_PASSWORD" ping
              else
                redis-cli ping
              fi
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-cli -a "$REDIS_PASSWORD" ping
              else
                redis-cli ping
              fi
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
