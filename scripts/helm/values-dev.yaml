# Default values for dsl-bot-backend (DEV environment)
environment: dev

# Release metadata
releaseName: dsl-bot-backend-dev
managedBy: Helm

# Labels configuration
labels:
  appName: dsl-bot-backend
  instance: dsl-bot-backend-dev

# Kafka configuration
kafka:
  image:
    repository: apache/kafka
    tag: "4.1.0"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use localhost for controller quorum voters
    controllerQuorumVoters: "1@localhost:29093"
  
  service:
    type: ClusterIP # internal-only service (not exposed outside cluster)
  
  resources:
    limits:
      cpu: 800m # max 0.8 CPU cores
      memory: 2Gi # max 2 GiB RAM
    requests: # guaranteed resources reserved for Kafka
      cpu: 400m # min 0.4 CPU cores
      memory: 1Gi # min 1 GiB RAM

# Backend API configuration
api:
  replicaCount: 2
  
  # HPA
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  image:
    repository: "" # Set via --set api.image.repository="${AZURE_CONTAINER_REGISTRY_LOGIN_SERVER}/dsl-bot-backend-api"
    tag: "" # Set via --set api.image.tag="${VERSION}-${ENV}"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use service name for Kafka bootstrap servers
    kafkaBootstrapServers: "dsl-bot-backend-dev-kafka:9092" # Kafka connection using Kubernetes service DNS name
  
  # Load all env vars from Kubernetes Secret (created from .env.dev)
  envFrom:
    - secretRef:
        name: dsl-bot-backend-dev-secrets
  
  service:
    type: LoadBalancer # Creates a public IP address (Azure Load Balancer)
    port: 8000 # The port exposed externally
  
  resources:
    limits: #  max 1.2 CPU cores, 1 GiB memory
      cpu: 1200m
      memory: 1Gi
    requests: # guaranteed 0.6 CPU cores, 512 MiB memory
      cpu: 600m
      memory: 512Mi

# Kafka Consumer configuration
kafkaConsumer:
  replicaCount: 1
  
  image:
    repository: "" # Set via --set kafkaConsumer.image.repository="${AZURE_CONTAINER_REGISTRY_LOGIN_SERVER}/dsl-bot-backend-api"
    tag: "" # Set via --set kafkaConsumer.image.tag="${VERSION}-${ENV}"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use service name for Kafka bootstrap servers
    kafkaBootstrapServers: "dsl-bot-backend-dev-kafka:9092" # Kafka connection using Kubernetes service DNS name
  
  # Load all env vars from Kubernetes Secret (created from .env.dev)
  envFrom:
    - secretRef:
        name: dsl-bot-backend-dev-secrets
  
  resources:
    limits: # Max 0.6 CPU cores, 512 MiB memory
      cpu: 600m
      memory: 512Mi
    requests: # Guaranteed 0.3 CPU cores, 256 MiB memory
      cpu: 300m
      memory: 256Mi

fullnameOverride: "dsl-bot-backend-dev"

# Redis session store (single-pod, no auth in dev)
redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  env:
    redisHost: "redis"  # matches the Redis service name in both Docker Compose and Helm
    redisPort: "6379"
    redisPassword: ""                          # empty = no auth (dev only)
    redisSessionTtlSeconds: "3600"
