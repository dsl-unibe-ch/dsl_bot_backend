# Default values for dsl-bot-backend (PROD environment)
environment: prod

# Release metadata
releaseName: dsl-bot-backend-prod
managedBy: Helm

# Labels configuration
labels:
  appName: dsl-bot-backend
  instance: dsl-bot-backend-prod

# Kafka configuration
kafka:
  image:
    repository: apache/kafka
    tag: "4.1.0"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use localhost for controller quorum voters
    controllerQuorumVoters: "1@localhost:29093"
  
  service:
    type: ClusterIP
  
  resources:
    limits:
      cpu: 800m
      memory: 2Gi
    requests:
      cpu: 400m
      memory: 1Gi

# Backend API configuration
api:
  replicaCount: 2
  
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  image:
    repository: "" # Set via --set api.image.repository="${AZURE_CONTAINER_REGISTRY_LOGIN_SERVER}/dsl-bot-backend-api"
    tag: "" # Set via --set api.image.tag="${VERSION}-${ENV}"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use service name for Kafka bootstrap servers
    kafkaBootstrapServers: "dsl-bot-backend-prod-kafka:9092"
  
  # Load all env vars from Kubernetes Secret (created from .env.prod)
  envFrom:
    - secretRef:
        name: dsl-bot-backend-prod-secrets
  
  service:
    type: LoadBalancer
    port: 8000
  
  resources:
    limits:
      cpu: 1200m
      memory: 1Gi
    requests:
      cpu: 600m
      memory: 512Mi

# Kafka Consumer configuration
kafkaConsumer:
  replicaCount: 1
  
  image:
    repository: "" # Set via --set kafkaConsumer.image.repository="${AZURE_CONTAINER_REGISTRY_LOGIN_SERVER}/dsl-bot-backend-api"
    tag: "" # Set via --set kafkaConsumer.image.tag="${VERSION}-${ENV}"
    pullPolicy: IfNotPresent
  
  env:
    # K8s-specific: Use service name for Kafka bootstrap servers
    kafkaBootstrapServers: "dsl-bot-backend-prod-kafka:9092"
  
  # Load all env vars from Kubernetes Secret (created from .env.prod)
  envFrom:
    - secretRef:
        name: dsl-bot-backend-prod-secrets
  
  resources:
    limits:
      cpu: 600m
      memory: 512Mi
    requests:
      cpu: 300m
      memory: 256Mi

fullnameOverride: "dsl-bot-backend-prod"

# Redis session store
redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    redisHost: "redis"  # matches the Redis service name in both Docker Compose and Helm
    redisPort: "6379"
    redisPassword: ""                           # set via Kubernetes Secret in prod (see README)
    redisSessionTtlSeconds: "3600"
